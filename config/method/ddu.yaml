name: "ddu"
classification: basic
uncertainty: entropy
# DDU flags a sample OOD if its GDA log-density <= threshold; aleatoric is NaN for those samples.
# Leave ood_log_density_threshold null to calibrate it as the ood_quantile of training log-densities.
ood_log_density_threshold: null
ood_quantile: 0.05
misclassify_threshold: 0.0

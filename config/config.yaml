defaults:
  - dataset: isic
  - model: mlp
  - method: mc_dropout
  - optimizer: sgd
  - experiment: isic_drop
  - _self_

seed: 11111
num_runs: 10   
weighted: False

setup_only: false
methods_to_run: []

data:
  root: ${hydra:runtime.cwd}/data

output:
  # models/, results/, plots/ and Hydra logs are written under this dir
  root: /work3/sarste/uncertainty-benchmark
  save_model: true
  save_metrics: true
  run_id: ${now:%Y-%m-%d_%H-%M-%S}

hydra:
  run:
    dir: ${output.root}/results/${now:%Y-%m-%d}/${experiment.name}

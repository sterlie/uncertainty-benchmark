name: isic
batch_size: 16
num_classes: 6
channels: 3
image_size: 224
input_dim: 150528
num_workers: 4
pin_memory: true
train_subset: null
test_subset: null
data_root: ${data.root}/isic
images_dir: ${dataset.data_root}/MILK10k_Training_Input
metadata_csv: ${dataset.data_root}/MILK10k_Training_Metadata.csv
groundtruth_csv: ${dataset.data_root}/MILK10k_Training_GroundTruth.csv
image_id_col: isic_id
lesion_id_col: lesion_id
nested_image_folders: true
image_type_filter: [dermoscopic]
all_classes: [AKIEC, BCC, BEN_OTH, BKL, DF, INF, MAL_OTH, MEL, NV, SCCKA, VASC]
selected_classes: [BCC, SCCKA, AKIEC, NV, BKL, MEL]
val_ratio: 0.2
test_ratio: 0.2


cv:
  enabled: true
  n_splits: 5
  fold_index: 0
  seed: ${seed}

# Used by the isic_pc1 experiment: PCA on downscaled images, bins along PC1.
# Train/val = images within max_dist of the PC1 line; test = test_per_bin per bin from the rest.
pc1:
  n_bins: 4
  max_dist: 7.0            # distance to PC1 line (64px RGB pixels in [0,1]); 7.0 -> ~950 images
  val_ratio: 0.1
  test_per_bin: 45
  binning: uniform         # uniform (equal-width bins) or quantile (equally populated bins)
  pca_image_size: 64
